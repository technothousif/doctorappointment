<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">

  <title>Doctor Appointment System</title>

  <link rel="stylesheet" href="style.css">

</head>

<body>

  <div class="container">

    <header>

      <h1>Doctor Appointment Booking</h1>

      <p>Book your appointment easily online</p>

    </header>

    <div class="card">

      <h2>Book Appointment</h2>

      <form>

        <label>Patient Name</label>

        <input type="text" placeholder="Enter your name">

        <label>Phone Number</label>

        <input type="text" placeholder="Enter mobile number">

        <label>Date</label>

        <input type="date">

        <label>Time</label>

        <input type="time">

        <label>Select Doctor</label>

        <select>

          <option>Mohammed Thousif</option>

          <option>Faizan Rasheed</option>

          <option>Aboobaquer Sanad</option>

          <option>Sheikh Afil H</option>

          <option>Ruvez Abdul Rehman</option>

        </select>

        <label>Reason for Visit</label>

        <textarea placeholder="Describe your problem..."></textarea>

        <button type="button">Book Appointment</button>

      </form>

    </div>

    <div class="card">

      <h2>Available Doctors</h2>

      <div class="doctor-grid">

        <div class="doctor">Mohammed Thousif</div>

        <div class="doctor">Faizan Rasheed</div>

        <div class="doctor">Aboobaquer Sanad</div>

        <div class="doctor">Sheikh Afil H</div>

        <div class="doctor">Ruvez Abdul Rehman</div>

      </div>

    </div>

    <footer>

      <p>© 2026 Doctor Appointment System | Mini Project</p>

    </footer>

  </div>

</body>

</html>
